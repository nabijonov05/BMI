<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMI (BMI) Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
        <!-- Sarlavha -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">TMI Calculator</h1>
            <p class="text-sm text-slate-500 mt-1">Vazningiz va boyingiz bo'yicha salomatligingizni tekshiring</p>
        </div>

        <!-- Forma POST metodi orqali Django ga yuboriladi -->
        <form method="POST" action="" class="space-y-4">
            {% csrf_token %} <!-- Django xavfsizlik tokeni (SHART!) -->
            
            <!-- Boy uzunligi -->
            <div>
                <label for="height" class="block text-sm font-medium text-slate-700 mb-1">Boy uzunligi (sm)</label>
                <input type="number" id="height" name="height" placeholder="Masalan: 175" value="{{ height|default:'' }}" required step="any"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <!-- Vazn -->
            <div>
                <label for="weight" class="block text-sm font-medium text-slate-700 mb-1">Vazn (kg)</label>
                <input type="number" id="weight" name="weight" placeholder="Masalan: 70" value="{{ weight|default:'' }}" required step="any"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <!-- Hisoblash tugmasi -->
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
                Hisoblash
            </button>
        </form>

        <!-- Django backend'dan natija kelsa ko'rsatiladi -->
        {% if bmi %}
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 text-center space-y-2">
            <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Sizning TMI ko'rsatkichingiz</span>
            <div class="text-4xl font-extrabold text-indigo-600">{{ bmi }}</div>
            <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-{{ color }}-100 text-{{ color }}-800">
                {{ status }}
            </div>
            <p class="text-xs text-slate-500 mt-2">{{ advice }}</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="p-3 bg-red-100 text-red-700 text-xs rounded-lg text-center">
            {{ error }}
        </div>
        {% endif %}
    </div>

</body>
</html>
